<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<article data-testid="test-todo-card" class="card">

  <h2 data-testid="test-todo-title" id="title">Build Todo Card</h2>

  <div data-testid="test-todo-collapsible-section" id="descSection">
    <p data-testid="test-todo-description" id="description">
      Build a responsive and accessible Todo card component for frontend assessment submission.
    </p>
  </div>

  <button 
    data-testid="test-todo-expand-toggle" 
    id="toggleBtn"
    aria-expanded="false"
    aria-controls="descSection"
  >
    Show more
  </button>

  <div>
    <span data-testid="test-todo-priority">High</span>
    <span data-testid="test-todo-priority-indicator" id="priorityIndicator"></span>
  </div>

  <div>
    <span data-testid="test-todo-status" id="statusText">Pending</span>
    <select data-testid="test-todo-status-control" id="statusControl">
      <option>Pending</option>
      <option>In Progress</option>
      <option>Done</option>
    </select>
  </div>

  <time data-testid="test-todo-due-date" id="dueDate"></time>
  <div data-testid="test-todo-time-remaining" id="timeRemaining" aria-live="polite"></div>
  <div data-testid="test-todo-overdue-indicator" id="overdue"></div>

  <ul data-testid="test-todo-tags">
    <li data-testid="test-todo-tag-work">work</li>
    <li data-testid="test-todo-tag-urgent">urgent</li>
    <li data-testid="test-todo-tag-design">design</li>
  </ul>

  <div>
    <input type="checkbox" id="checkbox" data-testid="test-todo-complete-toggle"/>
    <label for="checkbox">Mark as complete</label>
  </div>

  <button data-testid="test-todo-edit-button" id="editBtn">Edit</button>
  <button data-testid="test-todo-delete-button">Delete</button>

  <form data-testid="test-todo-edit-form" id="editForm" hidden>

    <label>Title</label>
    <input data-testid="test-todo-edit-title-input" id="editTitle"/>

    <label>Description</label>
    <textarea data-testid="test-todo-edit-description-input" id="editDesc"></textarea>

    <label>Priority</label>
    <select data-testid="test-todo-edit-priority-select" id="editPriority">
      <option>Low</option>
      <option>Medium</option>
      <option>High</option>
    </select>

    <label>Due Date</label>
    <input type="datetime-local" data-testid="test-todo-edit-due-date-input" id="editDate"/>

    <button type="button" data-testid="test-todo-save-button" id="saveBtn">Save</button>
    <button type="button" data-testid="test-todo-cancel-button" id="cancelBtn">Cancel</button>

  </form>

</article>

<script src="script.js"></script>
</body>
</html>
